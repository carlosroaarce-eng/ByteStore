<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Administración ByteStore"><title>ByteStore Admin | Órdenes</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/styles.css"></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark d-lg-none"><div class="container"><a class="navbar-brand fw-bold" href="index.html">ByteStore Admin</a><button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminMenu"><span class="navbar-toggler-icon"></span></button></div></nav>
<div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="adminMenu"><div class="offcanvas-header"><h2 class="offcanvas-title h5">ByteStore Admin</h2><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body"><div class="d-grid gap-2"><a class="btn btn-outline-light text-start" href="index.html">Inicio</a><a class="btn btn-outline-light text-start" data-role="Administrador,Vendedor" href="productos.html">Productos</a><a class="btn btn-outline-light text-start" data-role="Administrador" href="usuarios.html">Usuarios</a><a class="btn btn-outline-light text-start" data-role="Administrador,Vendedor" href="ordenes.html">Órdenes</a><a class="btn btn-outline-light text-start" href="../index.html">Ver tienda</a><button class="btn btn-warning text-start" id="logout-btn">Cerrar sesión</button></div></div></div><div class="container-fluid"><div class="row"><aside class="col-lg-2 d-none d-lg-flex flex-column bg-dark text-white p-3 admin-sidebar position-sticky top-0"><a href="index.html" class="navbar-brand fw-bold mb-4">ByteStore Admin</a><div class="d-grid gap-2"><a class="btn btn-outline-light text-start" href="index.html">Inicio</a><a class="btn btn-outline-light text-start" data-role="Administrador,Vendedor" href="productos.html">Productos</a><a class="btn btn-outline-light text-start" data-role="Administrador" href="usuarios.html">Usuarios</a><a class="btn btn-outline-light text-start" data-role="Administrador,Vendedor" href="ordenes.html">Órdenes</a><a class="btn btn-outline-light text-start" href="../index.html">Ver tienda</a><button class="btn btn-warning text-start" id="logout-btn">Cerrar sesión</button></div><div class="mt-auto small opacity-75">Sesión: <span id="session-name">Sin sesión</span></div></aside><main class="col-lg-10 px-0"><div class="container-fluid py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="fw-bold">Órdenes</h1><p class="text-secondary mb-0">Órdenes generadas desde la demo del carrito.</p></div></div><div id="ordenes-lista" class="row g-3"></div></div></main></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="../js/datos.js"></script><script src="../js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const t=document.getElementById('ordenes-lista');const orders=readJSON(STORAGE.ordenes,[]);t.innerHTML=orders.length?orders.slice().reverse().map(o=>`<div class="col-md-6"><div class="card border-0 shadow-sm h-100"><div class="card-body"><div class="d-flex justify-content-between"><h2 class="h6">Orden #${o.id}</h2><span class="badge text-bg-warning">${o.estado}</span></div><p class="small text-secondary">${o.fecha}</p><p class="fw-bold">Total: ${money(o.total)}</p><button class="btn btn-sm btn-outline-primary" onclick="this.nextElementSibling.classList.toggle('d-none')">Ver detalle</button><div class="mt-3 d-none">${o.items.map(i=>`<div class="d-flex justify-content-between small border-top py-2"><span>${escapeHtml(i.nombre)} x${i.cantidad}</span><span>${money(i.precio*i.cantidad)}</span></div>`).join('')}</div></div></div></div>`).join(''):'<div class="col-12"><div class="alert alert-light border">Todavía no hay órdenes.</div></div>';});</script><script>requireRole(['Administrador','Vendedor']);</script></body></html>
